[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eisfit"
version = "0.1.0"
description = "Electrochemical impedance spectroscopy fitting and parameter identification tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shiyun" }]
keywords = ["battery", "EIS", "impedance", "parameter-identification", "electrochemistry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter>=1.0"]

[project.scripts]
eisfit = "eisfit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eisfit"]
only-packages = true

[tool.hatch.build.targets.sdist]
include = [
    "/src/eisfit",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]
